server.port=${PORT:8080}
logging.level.org.atmosphere=warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

# To improve the performance during development.
# For more information https://vaadin.com/docs/latest/flow/integrations/spring/configuration#special-configuration-parameters
vaadin.allowed-packages=com.vaadin,org.vaadin,com.flowingcode,com.github.avec112

# Shared spell-check vocabulary (Postgres). In development the connection comes from
# compose.yaml via Spring Boot's Docker Compose support; in production set
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
# Flyway creates the tables (src/main/resources/db/migration); Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
